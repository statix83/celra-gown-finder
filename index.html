const S={occ:null,col:null,sty:null,date:null,dateAsked:false,sel:[],shown:0,list:[]};
const log=document.getElementById('log');
document.addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='IMG')return;var n=+(t.dataset.rt||0);if(n>=2)return;t.dataset.rt=n+1;t.removeAttribute('srcset');var b=t.src.split('&rt=')[0];setTimeout(function(){t.src=b+'&rt='+Date.now()},400+500*n)},true);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byCode=c=>G.find(g=>g[0]===c);
const colName=k=>k==='any'?'semua warna':(COLOURS.find(c=>c[0]===k)||[,'',''])[1];
const styName=k=>k==='any'?'semua model':(STYLES.find(s=>s[0]===k)||[,''])[1];
const occName=k=>(OCC.find(o=>o[0]===k)||[,'','',''])[3];
const fmtDate=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const waLink=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
const joinID=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' dan '+a[a.length-1];
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const topH=()=>document.querySelector('.top').offsetHeight+12;
function scrollTo_(node){requestAnimationFrame(()=>{const y=node.getBoundingClientRect().top+scrollY-topH();window.scrollTo({top:y,behavior:reduce?'auto':'smooth'})})}
function scrollEnd(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:reduce?'auto':'smooth'}))}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
async function bot(html,noScroll){const t=el('div','msg bot typing','<span class="av" aria-hidden="true">C</span><span class="bub"><i></i><i></i><i></i></span>');log.appendChild(t);if(!noScroll)scrollEnd();await sleep(550);t.remove();const m=el('div','msg bot','<span class="av" aria-hidden="true">C</span><div class="bub">'+html+'</div>');log.appendChild(m);if(!noScroll)scrollEnd();return m}
function me(text,step){const m=el('div','msg me');m.dataset.step=step;const b=el('button','edit','Ubah');b.type='button';b.addEventListener('click',()=>restartFrom(step));m.appendChild(b);m.appendChild(el('div','bub',esc(text)));log.appendChild(m);scrollEnd();return m}
function chips(items,onPick,noScroll){const w=el('div','chips');items.forEach(it=>{const b=el('button','chip'+(it.cls?' '+it.cls:''));b.type='button';b.innerHTML=(it.dot?'<span class="dot" style="background:'+it.dot+'"></span>':'')+'<span>'+esc(it.label)+'</span>'+(it.n!=null?'<span class="n">'+it.n+'</span>':'');b.addEventListener('click',()=>{if(!it.keep)w.remove();onPick(it)});w.appendChild(b)});log.appendChild(w);if(!noScroll){scrollEnd();const f=w.querySelector('button');if(f&&!reduce)f.focus({preventScroll:true})}return w}
async function restartFrom(step){
  if(step==='pick'){const r=log.querySelector('.results');if(r)scrollTo_(r);return}
  const nodes=[...log.children];const i=nodes.findIndex(n=>n.dataset.q===step);if(i>=0)nodes.slice(i).forEach(n=>n.remove());
  if(step==='occ'){S.occ=S.col=S.sty=null;askOcc()}
  else if(step==='col'){S.col=S.sty=null;askCol()}
  else if(step==='sty'){S.sty=null;askSty()}
  else if(step==='date'){S.date=null;askDate()}
  updateStylist();
}
async function askOcc(){const m=await bot('Untuk acara apa gaunnya?');m.dataset.q='occ';chips(OCC.map(o=>({label:o[1],k:o[0]})),it=>{S.occ=it.k;me(it.label,'occ');askCol()})}
async function askCol(){const m=await bot('Warna apa yang Anda suka?');m.dataset.q='col';
  const items=COLOURS.map(c=>({label:c[1],k:c[0],dot:c[2],n:G.filter(g=>g[1]===c[0]).length}));items.push({label:'Semua warna',k:'any',cls:'soft',n:G.length});
  chips(items,it=>{S.col=it.k;me(it.label,'col');askSty()})}
async function askSty(){const pool=G.filter(g=>S.col==='any'||g[1]===S.col);
  const m=await bot('Model seperti apa?'+(S.col!=='any'?' <span style="color:var(--muted)">Contoh foto dari gaun '+esc(colName(S.col).toLowerCase())+' kami.</span>':' <span style="color:var(--muted)">Pilih yang paling mirip dengan bayangan Anda.</span>'),true);m.dataset.q='sty';
  const pickRep=k=>{if(S.col==='any')return byCode(STYLEREP[k]);const w=pool.filter(g=>g[3].includes(k));return w.find(g=>g[3][0]===k&&g[3].length===1)||w.find(g=>g[3][0]===k)||w[0]};
  const items=STYLES.map(s=>({label:s[1],k:s[0],n:pool.filter(g=>g[3].includes(s[0])).length})).filter(x=>x.n>0);
  const grid=el('div','tiles');let done=false;
  const pick=(k,label)=>{if(done)return;done=true;grid.remove();after.remove();S.sty=k;me(label,'sty');showResults()};
  items.forEach(it=>{const r=pickRep(it.k);const b=el('button','tile');b.type='button';
    b.innerHTML='<img loading="lazy" decoding="async" alt="" src="'+IMG+r[2]+'.jpg?w=300">'+'<span class="tl"><span class="tn"><span>'+esc(it.label)+'</span><span class="n">'+it.n+'</span></span><span class="td">'+esc(STYLEHINT[it.k])+'</span></span>';
    b.setAttribute('aria-label',it.label+', '+it.n+' gaun. '+STYLEHINT[it.k]);
    b.addEventListener('click',()=>pick(it.k,it.label));grid.appendChild(b)});
  log.appendChild(grid);
  const after=el('div','chips after-tiles');const all=el('button','chip soft','<span>Semua model</span><span class="n">'+pool.length+'</span>');all.type='button';all.addEventListener('click',()=>pick('any','Semua model'));after.appendChild(all);log.appendChild(after);
  scrollTo_(m);
}
function score(g){const pref=(OCC.find(o=>o[0]===S.occ)||[,,''])[2];let s=0;for(const t of pref)if(g[3].includes(t))s++;return s}
async function showResults(){updateStylist();
  let list=G.map((g,i)=>({g,i})).filter(x=>(S.col==='any'||x.g[1]===S.col)&&(S.sty==='any'||x.g[3].includes(S.sty)));let intro;
  if(list.length){list.sort((a,b)=>score(b.g)-score(a.g)||a.i-b.i);
    const desc=[S.col!=='any'?colName(S.col).toLowerCase():'',S.sty!=='any'?'model '+styName(S.sty):''].filter(Boolean).join(', ');
    intro='Ada <b>'+list.length+' gaun</b>'+(desc?' '+esc(desc):'')+' yang cocok. Tap foto untuk melihat lebih besar, lalu tekan <b>Pilih gaun ini</b> pada gaun yang Anda suka.';}
  else{list=G.map((g,i)=>({g,i})).filter(x=>x.g[1]===S.col);list.sort((a,b)=>score(b.g)-score(a.g)||a.i-b.i);
    intro='Belum ada model '+esc(styName(S.sty).toLowerCase())+' dalam warna '+esc(colName(S.col).toLowerCase())+'. Ini gaun '+esc(colName(S.col).toLowerCase())+' lainnya yang bisa jadi pilihan.';}
  S.list=list.map(x=>x.g);S.shown=0;
  const m=await bot(intro,true);m.dataset.q='res';
  renderMore(m);
}
function isSel(g){return S.sel.includes(g[0])}
function selBtnHTML(g){return isSel(g)?'&#10003; Dipilih':'Pilih gaun ini'}
function refreshSelButtons(){document.querySelectorAll('[data-pick]').forEach(b=>{const g=byCode(b.dataset.pick);b.innerHTML=selBtnHTML(g);b.classList.toggle('on',isSel(g));b.setAttribute('aria-pressed',isSel(g))})}
function card(g,idx){const c=el('article','card');const alt='Gaun sewa CELRA.id '+g[0];
  c.innerHTML='<button type="button" class="card-img" aria-label="Perbesar foto '+esc(g[0])+'"><img loading="lazy" decoding="async" src="'+IMG+g[2]+'.jpg?w=450" srcset="'+IMG+g[2]+'.jpg?w=300 300w, '+IMG+g[2]+'.jpg?w=450 450w, '+IMG+g[2]+'.jpg?w=600 600w" sizes="(min-width:640px) 190px, 44vw" alt="'+esc(alt)+'" width="450" height="600"></button><div class="card-b"><span class="code">'+esc(g[0])+'</span><span class="tags">'+g[3].split('').map(t=>TAGNAME[t]).join(' · ')+'</span><button type="button" class="btn pick'+(isSel(g)?' on':'')+'" data-pick="'+esc(g[0])+'" aria-pressed="'+isSel(g)+'">'+selBtnHTML(g)+'</button></div>';
  c.querySelector('.card-img').addEventListener('click',()=>openLB(idx));
  c.querySelector('[data-pick]').addEventListener('click',()=>toggleGown(g));return c}
function renderMore(anchor){const grid=el('div','results');grid.dataset.q='res';const next=S.list.slice(S.shown,S.shown+6);next.forEach((g,k)=>grid.appendChild(card(g,S.shown+k)));S.shown+=next.length;
  const oldMore=log.querySelector('.chips.more');const where=oldMore||null;
  if(where){log.insertBefore(grid,where);where.remove()}else{log.appendChild(grid)}
  const rest=S.list.length-S.shown;const items=[];if(rest>0)items.push({label:'Tampilkan '+Math.min(6,rest)+' lagi',k:'more',cls:'dark'});
  items.push({label:'Ubah warna',k:'col'},{label:'Ubah model',k:'sty'},{label:'Mulai lagi',k:'occ',cls:'soft'});
  const w=chips(items,it=>{if(it.k==='more'){renderMore()}else{restartFrom(it.k)}},true);w.classList.add('more');w.dataset.q='res';
  if(grid.nextSibling!==w)grid.after(w);
  const fin=log.querySelector('.final-wrap');if(fin)log.appendChild(fin);
  scrollTo_(anchor||grid);
}
function toggleGown(g){
  if(isSel(g)){S.sel=S.sel.filter(c=>c!==g[0]);refreshSelButtons();renderFinal();updateStylist();return}
  if(S.sel.length>=MAXSEL){alertMsg('Maksimal '+MAXSEL+' gaun sekali tanya. Hapus salah satu dulu, ya.');return}
  S.sel.push(g[0]);refreshSelButtons();updateStylist();
  if(!S.dateAsked){S.dateAsked=true;me('Saya pilih '+g[0],'pick');askDate()}
  else{renderFinal(true)}
}
function alertMsg(t){bot(esc(t))}
async function askDate(){const m=await bot('Pilihan yang cantik. Kapan tanggal acaranya? <span style="color:var(--muted)">Dengan tanggal, tim kami bisa langsung cek ketersediaan.</span>');m.dataset.q='date';
  const row=el('div','date-row');row.dataset.q='date';const today=new Date();const iso=new Date(today.getTime()-today.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  row.innerHTML='<label for="evdate" style="position:absolute;left:-9999px">Tanggal acara</label><input type="date" id="evdate" min="'+iso+'"><button type="button" class="chip dark" id="dateGo">Lanjut</button><button type="button" class="chip soft" id="dateSkip">Belum pasti</button>';
  log.appendChild(row);scrollEnd();
  row.querySelector('#dateGo').addEventListener('click',()=>{const v=row.querySelector('#evdate').value;if(!v){row.querySelector('#evdate').focus();return}S.date=v;row.remove();me(fmtDate(v),'date');showFinal()});
  row.querySelector('#dateSkip').addEventListener('click',()=>{S.date=null;row.remove();me('Belum pasti','date');showFinal()});
}
function finalMsg(){const ph=S.sel.map(c=>c+': '+IMG+byCode(c)[2]+'.jpg?w=800').join('\n');return 'Halo CELRA.id, saya tertarik dengan gaun '+joinID(S.sel)+' untuk '+occName(S.occ)+(S.date?', tanggal '+fmtDate(S.date):'')+'. Apakah tersedia?'+'\n\nFoto gaunnya:\n'+ph+'\n\n(dari Gown Finder)'}
async function showFinal(){updateStylist();const old=log.querySelector('.final-wrap');if(old)old.remove();
  const wrap=el('div','final-wrap');wrap.dataset.q='date';log.appendChild(wrap);
  const t=el('div','msg bot typing','<span class="av" aria-hidden="true">C</span><span class="bub"><i></i><i></i><i></i></span>');wrap.appendChild(t);scrollEnd();await sleep(550);t.remove();
  wrap.appendChild(el('div','msg bot','<span class="av" aria-hidden="true">C</span><div class="bub">Siap! Ini ringkasan pilihan Anda. Tekan tombol di bawah untuk langsung bertanya ke tim kami di WhatsApp.</div>'));
  wrap.appendChild(el('div','final'));renderFinal();scrollTo_(wrap);
}
function renderFinal(flash){const wrap=log.querySelector('.final-wrap');if(!wrap)return;const f=wrap.querySelector('.final');
  if(!S.sel.length){f.innerHTML='<p class="fx">Belum ada gaun dipilih. Tekan <b>Pilih gaun ini</b> pada gaun di atas, lalu tombol WhatsApp akan muncul di sini.</p>';return}
  f.innerHTML='<div class="picked">'+S.sel.map(c=>{const g=byCode(c);return '<div class="pk"><img alt="" src="'+IMG+g[2]+'.jpg?w=200"><span>'+esc(c)+'</span><button type="button" class="rm" data-rm="'+esc(c)+'" aria-label="Hapus '+esc(c)+'">&#10005;</button></div>'}).join('')+'</div>'
   +'<dl class="facts"><div><dt>Acara</dt><dd>'+esc(OCC.find(o=>o[0]===S.occ)[1])+'</dd></div><div><dt>Tanggal</dt><dd>'+(S.date?esc(fmtDate(S.date)):'Belum pasti')+'</dd></div></dl>'
   +'<a class="wa-big" target="_blank" rel="noopener" href="'+waLink(finalMsg())+'">'+WAICON+'<span>Tanya ketersediaan via WhatsApp</span></a>'
   +'<div class="fchips"><button type="button" class="chip dark" data-act="redo">Pilih ulang gaun</button><button type="button" class="chip" data-act="add">Tambah gaun lain</button><button type="button" class="chip" data-act="date">Ubah tanggal</button><button type="button" class="chip soft" data-act="restart">Mulai lagi</button></div>'
   +'<p class="fx">Ketersediaan, ukuran dan harga dikonfirmasi langsung oleh tim kami lewat WhatsApp.</p>';
  f.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>toggleGown(byCode(b.dataset.rm))));
  f.querySelector('[data-act="redo"]').addEventListener('click',()=>{S.sel=[];refreshSelButtons();updateStylist();renderFinal();const r=log.querySelector('.results');if(r)scrollTo_(r)});
  f.querySelector('[data-act="add"]').addEventListener('click',()=>{const r=log.querySelector('.results');if(r)scrollTo_(r)});
  f.querySelector('[data-act="date"]').addEventListener('click',()=>{wrap.remove();const nodes=[...log.children];const i=nodes.findIndex(n=>n.dataset.q==='date');if(i>=0)nodes.slice(i).forEach(n=>n.remove());S.date=null;askDate()});
  f.querySelector('[data-act="restart"]').addEventListener('click',()=>{S.sel=[];S.date=null;S.dateAsked=false;restartFrom('occ')});
  if(flash){f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash');}
}
function updateStylist(){const a=document.getElementById('stylist');const parts=['Halo CELRA.id, saya sedang mencari gaun sewa'];if(S.occ)parts.push('untuk '+occName(S.occ));if(S.date)parts.push('tanggal '+fmtDate(S.date));let t=parts.join(' ')+'.';if(S.sel.length)t+=' Gaun yang saya suka: '+joinID(S.sel)+'.';else{if(S.col)t+=' Warna: '+colName(S.col)+'.';if(S.sty)t+=' Model: '+styName(S.sty)+'.';}t+=' Bisa dibantu rekomendasinya?';a.href=waLink(t)}
// lightbox
let lbIdx=0,lb=null;
function openLB(i){lbIdx=i;if(!lb){lb=el('div','lb');lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');lb.setAttribute('aria-label','Foto gaun');
  lb.innerHTML='<span class="count"></span><img alt=""><button type="button" class="x" aria-label="Tutup">&#10005;</button><button type="button" class="pv" aria-label="Sebelumnya">&#8249;</button><button type="button" class="nx" aria-label="Berikutnya">&#8250;</button><div class="cap"><span class="code"></span><button type="button" class="btn lbpick">Pilih gaun ini</button></div>';
  lb.querySelector('.x').onclick=closeLB;lb.querySelector('.pv').onclick=()=>step(-1);lb.querySelector('.nx').onclick=()=>step(1);
  lb.querySelector('.lbpick').onclick=()=>{const g=S.list[lbIdx];const wasSel=isSel(g);toggleGown(g);paintLB();if(!wasSel)closeLB()};
  lb.addEventListener('click',e=>{if(e.target===lb)closeLB()});
  let sx=null;lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)step(dx<0?1:-1);sx=null});
  document.body.appendChild(lb)}
  lb.hidden=false;document.body.style.overflow='hidden';paintLB();lb.querySelector('.x').focus()}
function paintLB(){const g=S.list[lbIdx];const img=lb.querySelector('img');img.src=IMG+g[2]+'.jpg?w=1200';img.alt='Gaun sewa CELRA.id '+g[0];lb.querySelector('.cap .code').textContent=g[0];const b=lb.querySelector('.lbpick');b.innerHTML=selBtnHTML(g);b.classList.toggle('on',isSel(g));lb.querySelector('.count').textContent=(lbIdx+1)+' / '+S.list.length;
  const nx=S.list[lbIdx+1];if(nx){const p=new Image();p.src=IMG+nx[2]+'.jpg?w=1200'}}
function step(d){lbIdx=(lbIdx+d+S.list.length)%S.list.length;paintLB()}
function closeLB(){lb.hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(!lb||lb.hidden)return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
updateStylist();
(async()=>{await bot('Halo! Saya asisten gaun <b>CELRA.id</b>. Saya bantu carikan gaun sewa yang pas untuk acara Anda.');askOcc()})();
</script>
</body>
</html>
